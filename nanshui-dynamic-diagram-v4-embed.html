<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EECP 南水北调效应 — 嵌入版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:#F5F0E8; color:#1a1a1a; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:12px 16px;
  }
  h1 { font-size:18px; color:#1A5C6E; margin-bottom:2px; letter-spacing:1px; }
  .sub { font-size:11px; color:#8a8a8a; margin-bottom:10px; }

  /* 单栏画布容器 */
  .cw {
    width:100%; max-width:1100px;
    background:#fff; border-radius:14px; border:1px solid rgba(26,92,110,0.10);
    padding:10px; position:relative;
    box-shadow:0 1px 6px rgba(0,0,0,0.05);
  }

  /* 图例 — 右上角 */
  .lgd {
    position:absolute; top:10px; right:14px;
    background:rgba(255,255,255,0.96); border:1px solid rgba(26,92,110,0.12); border-radius:8px;
    padding:9px 12px; font-size:11px; line-height:2; z-index:10;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .lr { display:flex; align-items:center; gap:6px; }
  .ls { width:18px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0; }

  svg { width:100%; display:block; }

  /* 控制区域 */
  .ctrl-bar {
    width:100%; max-width:1100px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-top:10px; padding:10px 14px;
    background:#fff; border-radius:12px; border:1px solid rgba(26,92,110,0.10);
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .ctrl-left { display:flex; align-items:center; gap:8px; }
  .ctrl-right { font-size:13px; color:#555; display:flex; gap:16px; }
  .btn {
    padding:7px 16px; border-radius:8px; border:1px solid rgba(26,92,110,0.15);
    background:#fff; color:#1A5C6E; cursor:pointer; font-size:13px; font-weight:600;
    transition:.2s; white-space:nowrap;
  }
  .btn:hover{background:#1A5C6E;color:#fff;border-color:#1A5C6E}
  .bn{background:#1A5C6E;border-color:#1A5C6E;color:#fff}
  .bn:hover{background:#154a58}

  /* 步骤指示器 */
  .si{display:flex;gap:6px;}
  .sd{
    width:30px;height:30px;border-radius:50%;
    background:#f5f5f5;border:1.5px solid #ddd;color:#999;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;
  }
  .sd.a{background:#1A5C6E;border-color:#1A5C6E;color:#fff}
  .sd.d{background:#eaf4e8;border-color:#8aba6e;color:#5a9a4a}

  /* 说明面板（在控制区下方） */
  .info-bar {
    width:100%; max-width:1100px; margin-top:8px; padding:12px 16px;
    background:rgba(26,92,110,0.04); border-radius:10px;
    border:1px solid rgba(26,92,110,0.08);
  }
  .info-bar h3{font-size:14px;color:#1A5C6E;margin-bottom:4px;}
  .info-bar p{font-size:13px;color:#444;line-height:1.7;}
  .info-bar .hl{color:#D4A843;font-weight:600}
  .info-bar .sl{display:inline-block;background:#1A5C6E;color:#fff;border-radius:4px;padding:0 6px;font-size:11px;margin-right:3px;}

  /* 数据行 */
  .data-row {
    width:100%; max-width:1100px; margin-top:8px;
    display:flex; gap:10px;
  }
  .dc{
    flex:1; background:#fff; border-radius:8px; padding:8px 12px;
    border:1px solid rgba(26,92,110,0.08); text-align:center; font-size:12.5px;
  }
  .dc .lbl{color:#888;font-size:11px}
  .dc .val{color:#1A5C6E;font-weight:700;font-size:15px}

  /* ===== SVG 样式 ===== */
  .hb{fill:#8B0000;stroke:#C41E3A;stroke-width:2}
  .lb{fill:#1e3550;stroke:#3a6090;stroke-width:1.5;opacity:0.82}

  /* 血管 */
  .art{stroke:#C41E3A;stroke-width:6;fill:none;opacity:0.88}
  .vei{stroke:#4169E1;stroke-width:6;fill:none;opacity:0.88}

  /* 气囊 */
  .cb{fill:#f8f6f0;stroke:#c0b898;stroke-width:1.8;rx:11}
  .cl{fill:#333;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .cs{fill:#777;font-size:12.5px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}

  /* 充气脉冲 — 居中 r 放大 */
  @keyframes cpulse{0%{r:0;opacity:.6}50%{r:50;opacity:.25}100%{r:72;opacity:0}}
  .cp{fill:none;stroke:#D4A843;stroke-width:3;opacity:0}
  .cp.a{animation:cpulse 1s ease-out forwards}

  /* 粒子流动 */
  @keyframes pflow{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .pd{r:5.5;opacity:0}.pd.a{animation:pflow 1.4s linear forwards}

  /* 方向箭头 */
  .da{fill:none;stroke-width:3;opacity:0;transition:opacity .35s}
  .da.v{opacity:1}

  /* 标注文字 — 加大！*/
  .la{fill:#C41E3A;font-size:14px;font-weight:600}
  .lv{fill:#4169E1;font-size:14px;font-weight:600}
  .lo{fill:#555;font-size:14px}
  .lt{fill:#1A5C6E;font-size:17px;font-weight:700}

  .div{stroke:#ccc;stroke-width:1;stroke-dasharray:7 4}

  /* 高亮框 */
  .hbX{fill:none;stroke:#D4A843;stroke-width:2.5;stroke-dasharray:6 3;opacity:0;transition:opacity .25s}
  .hbX.v{opacity:1}
</style>
</head>
<body>

    <circle class="pd" fill="#4488FF" filter="url(#glowP)" style="offset-path:url(#pathIVC);"/>
    <circle class="pd" fill="#6699FF" filter="url(#glowP)" style="offset-path:url(#pathIVC);" data-dly="0.5"/>

  <p>点击 <span class="hl">「开始演示」</span> 自动播放，或 <span class="hl">「单步」</span> 逐步查看。</p>
</div>

<script>
// ===== 步骤数据 =====
const ST=[
  {t:'等待开始',ph:'—',
   d:'点击「开始演示」自动播放，「单步」逐步查看。',
   pr:'—',dp:'—',gf:'—',c:'',ar:''},
  {t:'步骤 1 — 小腿充气',ph:'舒张早期',
   d:'<span class="sl">最远端先行</span> 小腿气囊首先充气，挤压下肢静脉启动第一级泵送。血液向近心端流动。',
   pr:'200',dp:'+40',gf:'+15%',c:'calf',ar:'dia'},
  {t:'步骤 2 — 大腿充气',ph:'舒张早-中期',
   d:'<span class="sl">序贯推进</span> 大腿气囊接着充气，承接小腿泵血，进一步向近心端推进，形成波浪式静脉回流。',
   pr:'220',dp:'+60',gf:'+25%',c:'thigh',ar:'dia'},
  {t:'步骤 3 — 臀部充气',ph:'舒张晚期',
   d:'<span class="sl">最终增压</span> 臀部最后充气，将大量血液泵入主动脉根部，直接增加冠脉灌注压——南水北调高潮。',
   pr:'250',dp:'+80',gf:'+35%',c:'hip',ar:'dia'},
  {t:'步骤 4 — 舒张期效果',ph:'舒张期末',
   d:'<span class="sl">增压完成</span> 三气囊全保持充气，血液大量回流。DPA +80mmHg，冠脉血流增加 35%。',
   pr:'250',dp:'+80',gf:'+35%',c:'all',ar:'dia'},
  {t:'步骤 5 — 收缩期排气',ph:'收缩期',
   d:'<span class="sl">顺水推舟</span> 收缩期前三气囊同时排气，后负荷↓，心肌耗氧降低。',
   pr:'0',dp:'维持+40',gf:'+20%',c:'none',ar:'sys'}
];

// ===== 状态 =====
const S={step:0,auto:false,timer:null,cyc:0,spd:1000};
const $=id=>document.getElementById(id);
const pcd=$('pcd');
const sds=document.querySelectorAll('.sd');

function setSI(s){
  sds.forEach(d=>{
    d.classList.remove('a','d'); const v=+d.dataset.s;
    if(v===0)return;if(v<s)d.classList.add('d');else if(v===s)d.classList.add('a');
  });
}
function updDP(d){
  $('dp').textContent=d.ph;
  $('ddpa').textContent=d.dp;
  $('dgf').textContent=d.gf;
}
function showHL(id){$(id).classList.add('v')}
function hideHL(id){$(id).classList.remove('v')}

function clrAll(){
  ['hH','hT','hC','hHt'].forEach(id=>hideHL(id));
  document.querySelectorAll('.cp').forEach(e=>e.classList.remove('a'));
  ['ad','as'].forEach(id=>{
    $(id).classList.remove('v');
    let n=$(id).nextElementSibling;
    if(n&&n.tagName==='text')n.setAttribute('opacity','0');
  });
  ['sqH','sqT','sqC'].forEach(id=>{ const el=$(id); if(el)el.setAttribute('opacity','0'); });
  document.querySelectorAll('.pd').forEach(p=>p.classList.remove('a'));
}

function trigCP(part,delay){
  ['1','2'].forEach((n,i)=>{
    const el=$('p'+part+n);
    if(!el)return;
    el.classList.remove('a');void el.offsetWidth;
    if(i===0)el.classList.add('a');
    else setTimeout(()=>el.classList.add('a'),delay||300);
  });
}

function showSeq(){
  ['sqH','sqT','sqC'].forEach(id=>{ const el=$(id); if(el)el.setAttribute('opacity','1'); });
}
function clearSeq(){
  ['sqH','sqT','sqC'].forEach(id=>{ const el=$(id); if(el)el.setAttribute('opacity','0'); });
}

function startParticles(color){
  document.querySelectorAll('.pd').forEach((p,i)=>{
    p.classList.remove('a');void p.offsetWidth;
    const dly=parseFloat(p.dataset.dly||0)*1000;
    setTimeout(()=>{p.classList.add('a');},dly);
  });
}

// ===== 执行步骤 =====
function runStep(s){
  if(s<1||s>5)return;
  const d=ST[s]; S.step=s;
  pcd.innerHTML=`<h3>💓 ${d.t}</h3><p>${d.d}</p>`;
  updDP(d); clrAll();

  if(d.c==='calf'){showHL('hC');trigCP('Calf',300);clearSeq();$('sqC').setAttribute('opacity','1');startParticles('blue');}
  else if(d.c==='thigh'){showHL('hT');trigCP('Thigh',300);clearSeq();$('sqT').setAttribute('opacity','1');startParticles('blue');}
  else if(d.c==='hip'){showHL('hH');trigCP('Hip',300);clearSeq();$('sqH').setAttribute('opacity','1');startParticles('blue');}
  else if(d.c==='all'){
    ['H','T','C'].forEach(p=>{showHL('h'+p);trigCP(p,200);});showSeq();showHL('hHt');startParticles('blue');
    setTimeout(()=>showHL('hHt'),350);
  }else if(d.c==='none'){
    clrAll();showHL('hHt');startParticles('red');
  }

  if(d.ar==='dia'){
    $('ad').classList.add('v');
    const tx=$('ad').nextElementSibling;
    if(tx)tx.setAttribute('opacity','1');
  }
  if(d.ar==='sys'){
    $('as').classList.add('v');
    const tx=$('as').nextElementSibling;
    if(tx)tx.setAttribute('opacity','1');
  }
  setSI(s);
}

// ===== 自动播放 =====
function doAuto(){
  if(!S.auto)return;
  if(S.step>=5){S.step=0;S.timer=setTimeout(doAuto,700);return;}
  S.step++;runStep(S.step);
  S.timer=setTimeout(doAuto,S.spd+350);
}
function startAuto(){
  if(S.auto)return;S.auto=true;S.step=0;S.cyc++;
  $('dc').textContent=S.cyc;$('bStart').textContent='⏸ 暂停';$('bStart').onclick=pauseAuto;doAuto();
}
function pauseAuto(){
  S.auto=false;clearTimeout(S.timer);
  $('bStart').textContent='▶ 继续';$('bStart').onclick=startAuto;
}

// ===== 单步 =====
function stepDemo(){
  if(S.auto)pauseAuto();
  if(S.step>=5){
    S.step=0;clrAll();
    pcd.innerHTML=`<h3>⏸ 等待开始</h3><p>点击「单步演示」查看。</p>`;
    updDP(ST[0]);setSI(0);
    return;
  }
  S.step++;runStep(S.step);
}

// ===== 绑定 =====
$('bStart').onclick=startAuto;
$('bStep').onclick=stepDemo;
sds.forEach(d=>{
  d.addEventListener('click',()=>{
    const s=+d.dataset.s;if(!s)return;
    if(S.auto)pauseAuto();S.step=s-1;runStep(s);
  });
});

window.addEventListener('DOMContentLoaded',()=>setTimeout(startAuto,1200));
</script>
